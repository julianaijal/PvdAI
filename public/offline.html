<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — PvdAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 400px;
      padding: 3rem 2rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #F43F5E, #FF6B81);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #F9FAFB; }
    p { color: #9CA3AF; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      padding: 0.75rem 2rem;
      background: #F43F5E;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">AI</div>
    <h1>Je bent offline</h1>
    <p>PvdAI heeft een internetverbinding nodig om te werken. Controleer je verbinding en probeer het opnieuw.</p>
    <button id="retry">Opnieuw proberen</button>
  </div>
  <script>document.getElementById("retry").addEventListener("click", function() { location.reload(); });</script>
</body>
</html>
